# Flowable configuration
flowable:
  database-schema-update: true
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  async-executor-activate: true
  # Use same datasource
  # identity service is available

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.approval.entity,com.example.approval.origin.beans
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# JoinFaces / JSF
joinfaces:
  faces:
    PROJECT_STAGE: Development
    FACELETS_SKIP_COMMENTS: true
    automatic-extensionless-mapping: true
  faces-servlet:
    enabled: true


server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    org.flowable: INFO
    com.example.approval: DEBUG
    org.mybatis: DEBUG

# Global notification configuration (usable by every process)
# See com.example.approval.notification.*
#
# Recipient resolution is DATABASE-FIRST: addresses are pulled live from the
# Oracle view FLOWABLE_USERS_VW via dedicated queries
# (FlowableIdentityMapper.findEmailsByGroup / findEmailByUsername):
#   - group task (not claimed) -> e-mail of EVERY member of the candidate
#     group (ROLE_CODE_ = group id)
#   - claimed task (assignee)  -> only the assignee's personal e-mail
#   - user notification        -> that user's personal e-mail
# group-mailboxes / user-mailboxes / user-email-domain below are only STATIC
# FALLBACKS used when the view returns nothing.
notification:
  enabled: true
  from: noreply@example.edu
  task-link-base: http://localhost:8080
  always-log: true
  # convention used when a username has no explicit user-mailbox entry
  user-email-domain: students.example.edu
  # fallback shared mailbox per candidate group / department id - only used
  # when FLOWABLE_USERS_VW returns no member addresses for the group
  group-mailboxes:
    DEN: den@example.edu
    HOD: hod@example.edu
    StudentServices: student-services@example.edu
    Warehouses: warehouses@example.edu
    HealthCareDept: health-care@example.edu
    LegalDepartment: legal@example.edu
    Student Deanship: student.deanship@example.edu
    MediaAndTraining Department: media.training@example.edu
    LibraryDepartment: library@example.edu
    IT Department: it@example.edu
    Enginering and Services Department: engineering.services@example.edu
    Finance Department: finance@example.edu
    Admission and Registration Department: admission.registration@example.edu
    Internal Audit Department: internal.audit@example.edu
  # fallback mailbox per username (wins over user-email-domain)
  user-mailboxes: {}
  # per-process JSF task page path used in deep links
  task-link-paths:
    clearanceLetterProcess: /clearance-task.xhtml

# Clearance Letter process configuration
clearance:
  departments:
    # ALL (default) | DEFAULT_ONLY | or per-initiator lists via initiator-overrides
    mode: ALL
    default-departments:
      - DEN
      - HOD
      - STD_SRV
      - WRH
      - HC
      - LGL
      - STD_DEN
      - MEDTRN
      - LIB
      - IT
      - ENG_SRV
    # optional per-initiator overrides, e.g.:
    # initiator-overrides:
    #   student.john: DEN,HOD,IT Department

# BPM business audit configuration (Oracle F_BPM_* tables on the external
# datasource; see com.example.approval.audit.* and docs/oracle-bpm-audit.md)
#
# CASE_ID of every F_BPM_* table is the Flowable process instance id of the
# started case, supplied by the caller - it is never generated here (no
# sequence / serial). Only the SERIAL columns of F_BPM_AUDIT_LOG_DTL and
# F_BPM_CASE_ATTACHMENTS are allocated below.
bpm:
  audit:
    # Global on/off switch of the whole audit trail: when false no rows are
    # written to any F_BPM_* table and /api/audit/** answers 503.
    enabled: true
    # Flowable process definition key -> BPM_DOCUMENTS.DOCUMENT_CODE
    document-codes:
      clearanceLetterProcess: 1
    default-document-code: 1
    # SERIAL-column generation: MAX_PLUS_ONE works on the shipped schema
    # (no Oracle sequences required); switch to SEQUENCE once the DBA has
    # created the sequences below.
    id-strategy: MAX_PLUS_ONE
    # Oracle sequences backing the SERIAL columns (SEQUENCE strategy only)
    detail-serial-sequence: F_BPM_AUDIT_LOG_DTL_SEQ
    attachment-serial-sequence: F_BPM_CASE_ATTACH_SEQ
    # directory the uploaded attachment binaries are written to
    upload-dir: ${java.io.tmpdir}/bpm-attachments