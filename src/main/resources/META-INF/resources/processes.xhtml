<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<f:metadata>
    <f:viewAction action="#{processListBean.init}"/>
</f:metadata>
<ui:composition template="/templates/portal.xhtml">
    <ui:param name="activeMenu" value="processes"/>

    <ui:define name="title">Processes - Workflow Station</ui:define>
    <ui:define name="pageTitle">Available Processes</ui:define>

    <ui:define name="content">
        <h:panelGroup rendered="#{!loginBean.loggedIn}" layout="block">
            <div class="empty-state">
                <i class="pi pi-lock"/>
                <div class="empty-title">You are not signed in</div>
                <p>Please sign in to browse available processes.</p>
                <p:button outcome="/login" value="Go to Sign in" icon="pi pi-sign-in"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{loginBean.loggedIn}" layout="block">
            <div class="page-head">
                <div>
                    <h1>Available Processes</h1>
                    <p class="page-sub">#{processListBean.availableProcessCount} process definition(s) you can start.</p>
                </div>
                <div class="spacer"/>
                <p:button outcome="/dashboard" value="Dashboard" icon="pi pi-home"
                          styleClass="ui-button-secondary ui-button-sm"/>
            </div>

            <h:form id="processesForm">
                <p:panel header="Processes you can start">
                    <p:dataTable id="processesTable" value="#{processListBean.availableProcesses}" var="pd"
                                 emptyMessage="There are no processes available for you to start."
                                 paginator="true" rows="10" paginatorAlwaysVisible="false"
                                 paginatorPosition="bottom"
                                 resizableColumns="true" reflow="true" size="small"
                                 widgetVar="processesTable">
                        <f:facet name="header">
                            <div class="table-toolbar">
                                <p:inputText id="globalFilter" placeholder="Search processes..."
                                             onkeyup="PF('processesTable').filter()"/>
                            </div>
                        </f:facet>

                        <p:column headerText="Name" sortBy="#{pd.name}" filterBy="#{pd.name}"
                                  filterMatchMode="contains">
                            <i class="pi pi-bolt" style="margin-inline-end:6px;color:var(--pf-primary);"/>
                            #{pd.name}
                        </p:column>
                        <p:column headerText="Key" sortBy="#{pd.key}" filterBy="#{pd.key}"
                                  filterMatchMode="contains">
                            <span class="text-muted">#{pd.key}</span>
                        </p:column>
                        <p:column headerText="Version" sortBy="#{pd.version}">
                            <span class="status info"><span class="dot"/>v#{pd.version}</span>
                        </p:column>
                        <p:column headerText="Action" styleClass="nowrap">
                            <p:commandButton value="Start" icon="pi pi-play"
                                             styleClass="ui-button-success ui-button-sm"
                                             action="#{processListBean.start(pd.key)}"/>
                        </p:column>
                    </p:dataTable>
                </p:panel>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
</html>
