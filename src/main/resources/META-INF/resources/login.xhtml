<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in - Workflow Station</title>
    <h:outputStylesheet name="css/portal.css"/>
</h:head>
<h:body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-badge"><i class="pi pi-verified"/></span>
                <div>
                    <h1 class="auth-title">Workflow Station</h1>
                </div>
            </div>
            <p class="auth-sub">Sign in with your university account to continue.</p>

            <h:messages styleClass="auth-messages" globalOnly="false"/>

            <h:form id="loginForm">
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="field">
                        <p:outputLabel for="username" value="Username"/>
                        <p:inputText id="username" value="#{loginBean.username}"
                                     required="true" requiredMessage="Username is required"
                                     autocomplete="username" placeholder="e.g. alice"/>
                        <p:message for="username"/>
                    </div>

                    <div class="field">
                        <p:outputLabel for="password" value="Password"/>
                        <p:password id="password" value="#{loginBean.password}"
                                    required="true" requiredMessage="Password is required"
                                    autocomplete="current-password" feedback="false"/>
                        <p:message for="password"/>
                    </div>

                    <p:commandButton id="loginBtn" value="Sign in" icon="pi pi-sign-in"
                                     action="#{loginBean.login}"
                                     styleClass="ui-button-lg w-full"
                                     onclick="PrimeFaces.widgets.loginBtn?.disable?.()"
                                     oncomplete="PrimeFaces.widgets.loginBtn?.enable?.()"/>
                </div>
            </h:form>

            <div class="field-hint" style="margin-top: 18px;">
                <strong>Demo users:</strong> alice (Initiator, IT) &#183; bob (Manager, IT) &#183;
                dave (Finance) &#183; frank (Initiator, HR) &#183; grace (Manager, HR)
            </div>
        </div>
    </div>
</h:body>
</html>
