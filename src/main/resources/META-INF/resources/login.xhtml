<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Login - Approval Workflow</title>
    <h:outputStylesheet name="css/portal.css"/>
</h:head>
<h:body>
    <div class="login-card">
        <h1>Approval Workflow Login</h1>
        <h:messages styleClass="msg" />

        <h:form id="loginForm">
            <div class="form-group">
                <h:outputLabel for="username" value="Username"/>
                <h:inputText id="username" value="#{loginBean.username}" required="true"
                             requiredMessage="Username is required"/>
            </div>
            <div class="form-group">
                <h:outputLabel for="password" value="Password"/>
                <h:inputSecret id="password" value="#{loginBean.password}" required="true"
                               requiredMessage="Password is required" autocomplete="current-password"/>
            </div>
            <div class="form-actions">
                <h:commandButton value="Login" action="#{loginBean.login}" styleClass="btn"/>
            </div>
        </h:form>

        <div class="hint">
            <p><strong>Demo users:</strong></p>
            <ul>
                <li>alice (INITIATOR - IT)</li>
                <li>bob (MANAGER - IT)</li>
                <li>dave (FINANCE)</li>
                <li>frank (INITIATOR - HR)</li>
                <li>grace (MANAGER - HR)</li>
            </ul>
        </div>
    </div>
</h:body>
</html>
