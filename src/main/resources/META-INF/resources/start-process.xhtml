<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/portal.xhtml">
    <ui:param name="activeMenu" value="start-process"/>

    <ui:define name="title">Start Request - Workflow Station</ui:define>
    <ui:define name="pageTitle">Start Approval Request</ui:define>

    <ui:define name="content">
        <h:panelGroup rendered="#{!loginBean.loggedIn}" layout="block">
            <div class="empty-state">
                <i class="pi pi-lock"/>
                <div class="empty-title">You are not signed in</div>
                <p>Please sign in to submit a request.</p>
                <p:button outcome="/login" value="Go to Sign in" icon="pi pi-sign-in"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{loginBean.loggedIn}" layout="block">
            <div class="page-head">
                <div>
                    <h1>Start Approval Request</h1>
                    <p class="page-sub">Submit a new generic approval request for your department.</p>
                </div>
            </div>

            <h:form id="startForm">
                <p:panel header="Request details">
                    <div class="form-grid">
                        <div class="field">
                            <p:outputLabel for="title" value="Title"/>
                            <p:inputText id="title" value="#{startProcessBean.contract.title}" required="true"
                                         requiredMessage="Title is required" placeholder="Short summary of the request"/>
                            <p:message for="title"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="amount" value="Requested Amount"/>
                            <p:inputText id="amount" value="#{startProcessBean.contract.amount}" required="true"
                                         requiredMessage="Amount is required"
                                         converterMessage="Please enter a valid number" placeholder="0.00"/>
                            <p:message for="amount"/>
                        </div>

                        <div class="field full">
                            <p:outputLabel for="department" value="Department"/>
                            <p:selectOneMenu id="department" value="#{startProcessBean.contract.department}"
                                             required="true" requiredMessage="Department is required">
                                <f:selectItem itemValue="" itemLabel="-- select --" noSelectionOption="true"/>
                                <f:selectItem itemValue="IT" itemLabel="IT"/>
                                <f:selectItem itemValue="HR" itemLabel="HR"/>
                                <f:selectItem itemValue="Finance" itemLabel="Finance"/>
                            </p:selectOneMenu>
                            <p:message for="department"/>
                        </div>

                        <div class="field full">
                            <p:outputLabel for="description" value="Description"/>
                            <p:inputTextarea id="description" value="#{startProcessBean.contract.description}"
                                             rows="4" counter="descCounter" counterTemplate="{0} characters"
                                             maxlength="1000" autoResize="true"/>
                            <h:panelGroup id="descCounter" styleClass="field-hint"/>
                        </div>
                    </div>

                    <div class="action-bar" style="margin-top:18px;">
                        <p:commandButton value="Submit Request" icon="pi pi-send"
                                         action="#{startProcessBean.submit}"
                                         styleClass="ui-button-success"/>
                        <p:button outcome="/dashboard" value="Cancel" icon="pi pi-times"
                                  styleClass="ui-button-secondary ui-button-outlined"/>
                    </div>
                </p:panel>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
</html>
