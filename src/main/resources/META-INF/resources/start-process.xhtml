<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/templates/portal.xhtml">
    <ui:param name="activeMenu" value="start-process"/>

    <ui:define name="title">Start Request - Approval Workflow</ui:define>
    <ui:define name="pageTitle">Start Approval Request</ui:define>

    <ui:define name="content">
        <h:panelGroup rendered="#{!loginBean.loggedIn}" layout="block">
            <div class="anon">
                <p>You are not logged in.</p>
                <h:link outcome="/login" value="Go to Login" styleClass="btn"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{loginBean.loggedIn}" layout="block">
            <h3 class="section-title">New request</h3>
            <div class="card form-card">
                <h:form id="startForm">
                    <div class="form-group">
                        <h:outputLabel for="title" value="Title *"/>
                        <h:inputText id="title" value="#{startProcessBean.contract.title}" required="true"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="description" value="Description"/>
                        <h:inputTextarea id="description" value="#{startProcessBean.contract.description}"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="amount" value="Requested Amount *"/>
                        <h:inputText id="amount" value="#{startProcessBean.contract.amount}" required="true"
                                     converterMessage="Please enter a valid number"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="department" value="Department *"/>
                        <h:selectOneMenu id="department" value="#{startProcessBean.contract.department}" required="true">
                            <f:selectItem itemValue="" itemLabel="-- select --"/>
                            <f:selectItem itemValue="IT" itemLabel="IT"/>
                            <f:selectItem itemValue="HR" itemLabel="HR"/>
                            <f:selectItem itemValue="Finance" itemLabel="Finance"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="form-actions">
                        <h:commandButton value="Submit Request" action="#{startProcessBean.submit}" styleClass="btn"/>
                        <h:link outcome="/dashboard" value="Cancel" styleClass="btn btn-secondary"/>
                    </div>
                </h:form>
            </div>
        </h:panelGroup>
    </ui:define>
</ui:composition>
</html>
