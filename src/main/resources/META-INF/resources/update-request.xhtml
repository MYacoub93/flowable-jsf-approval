<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/templates/portal.xhtml">
    <ui:define name="title">Update Request</ui:define>
    <ui:define name="pageTitle">Update Request</ui:define>

    <ui:define name="content">
        <h:panelGroup rendered="#{!loginBean.loggedIn}">
            <div class="anon">
                <p>Please <h:link outcome="/login" value="login"/> first.</p>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{loginBean.loggedIn}">
            <div class="info">
                Your request was rejected by <strong>#{updateRequestBean.rejectedBy}</strong>.
                Please update the details and resubmit. Previous comments: #{updateRequestBean.previousComments}
            </div>

            <h:form id="updateForm">
                <div class="form-group">
                    <h:outputLabel for="title" value="Title *"/>
                    <h:inputText id="title" value="#{updateRequestBean.contract.title}" required="true"/>
                </div>
                <div class="form-group">
                    <h:outputLabel for="description" value="Description"/>
                    <h:inputTextarea id="description" value="#{updateRequestBean.contract.description}"/>
                </div>
                <div class="form-group">
                    <h:outputLabel for="amount" value="Requested Amount *"/>
                    <h:inputText id="amount" value="#{updateRequestBean.contract.amount}" required="true"/>
                </div>
                <div class="form-group">
                    <h:outputLabel for="department" value="Department *"/>
                    <h:selectOneMenu id="department" value="#{updateRequestBean.contract.department}" required="true">
                        <f:selectItem itemValue="IT" itemLabel="IT"/>
                        <f:selectItem itemValue="HR" itemLabel="HR"/>
                        <f:selectItem itemValue="Finance" itemLabel="Finance"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-actions">
                    <h:commandButton value="Resubmit" action="#{updateRequestBean.resubmit}" styleClass="btn"/>
                    <h:link outcome="/dashboard" value="Cancel" styleClass="btn btn-secondary"/>
                </div>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
</html>
