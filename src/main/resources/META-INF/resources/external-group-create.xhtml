<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/portal.xhtml">
    <ui:param name="activeMenu" value="external-groups"/>

    <ui:define name="title">Create External Group - Workflow Station</ui:define>
    <ui:define name="pageTitle">Create External Group</ui:define>

    <ui:define name="content">
        <h:panelGroup rendered="#{!loginBean.loggedIn}" layout="block">
            <div class="empty-state">
                <i class="pi pi-lock"/>
                <div class="empty-title">You are not signed in</div>
                <p>Please sign in first.</p>
                <p:button outcome="/login" value="Go to Sign in" icon="pi pi-sign-in"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{loginBean.loggedIn and !externalGroupCreateBean.groupAdmin}" layout="block">
            <div class="empty-state">
                <i class="pi pi-ban"/>
                <div class="empty-title">Not authorized</div>
                <p>You are not authorized to manage external groups.</p>
                <p:button outcome="/dashboard" value="Back to Dashboard" icon="pi pi-home"
                          styleClass="ui-button-secondary"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{externalGroupCreateBean.groupAdmin}" layout="block">
            <div class="page-head">
                <div>
                    <h1>Create External Group</h1>
                    <p class="page-sub">Register a new external group / role (WEB_ROLES) that can be used as a Flowable candidate group.</p>
                </div>
            </div>

            <h:form id="groupCreateForm">
                <p:panel header="Group details">
                    <p:messages closable="true"/>
                    <div class="form-grid">
                        <div class="field">
                            <p:outputLabel for="roleCode" value="Role Code"/>
                            <p:inputText id="roleCode" value="#{externalGroupCreateBean.role.roleCode}"
                                         required="true" maxlength="200"
                                         requiredMessage="Role code is required"/>
                            <p:message for="roleCode"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="roleName" value="Role Name (English)"/>
                            <p:inputText id="roleName" value="#{externalGroupCreateBean.role.roleName}"
                                         required="true" maxlength="30"
                                         requiredMessage="Role name is required"/>
                            <p:message for="roleName"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="roleNameS" value="Role Name (Secondary)"/>
                            <p:inputText id="roleNameS" value="#{externalGroupCreateBean.role.roleNameS}"
                                         maxlength="30"/>
                        </div>

                        <div class="field full">
                            <p:outputLabel for="homeMsg" value="Home Message (English)"/>
                            <p:inputTextarea id="homeMsg" value="#{externalGroupCreateBean.role.homeMsg}" rows="3"/>
                        </div>

                        <div class="field full">
                            <p:outputLabel for="homeMsgS" value="Home Message (Secondary)"/>
                            <p:inputTextarea id="homeMsgS" value="#{externalGroupCreateBean.role.homeMsgS}" rows="3"/>
                        </div>
                    </div>

                    <div class="action-bar" style="margin-top:18px;">
                        <p:commandButton value="Create Group" icon="pi pi-plus"
                                         action="#{externalGroupCreateBean.save}"
                                         styleClass="ui-button-success"/>
                        <p:commandButton type="reset" value="Reset" icon="pi pi-replay"
                                         styleClass="ui-button-secondary ui-button-outlined"/>
                        <p:button outcome="/group-memberships" value="Group Memberships" icon="pi pi-users"
                                  styleClass="ui-button-secondary ui-button-outlined"/>
                    </div>
                </p:panel>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
</html>
