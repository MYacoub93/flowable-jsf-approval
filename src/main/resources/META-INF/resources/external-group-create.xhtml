<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/portal.xhtml">
    <ui:param name="activeMenu" value="external-groups"/>

    <ui:define name="title">#{labels['egc.browserTitle']} - #{labels['app.title']}</ui:define>
    <ui:define name="pageTitle">#{labels['egc.pageTitle']}</ui:define>

    <ui:define name="content">
        <h:panelGroup rendered="#{!loginBean.loggedIn}" layout="block">
            <div class="empty-state">
                <i class="pi pi-lock"/>
                <div class="empty-title">#{labels['login.notSignedIn.title']}</div>
                <p>#{labels['common.signInFirst']}</p>
                <p:button outcome="/login" value="#{labels['login.goToSignIn']}" icon="pi pi-sign-in"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{loginBean.loggedIn and !externalGroupCreateBean.groupAdmin}" layout="block">
            <div class="empty-state">
                <i class="pi pi-ban"/>
                <div class="empty-title">#{labels['common.notAuthorized.title']}</div>
                <p>#{labels['common.notAuth.groups']}</p>
                <p:button outcome="/dashboard" value="#{labels['common.backToDashboard']}" icon="pi pi-home"
                          styleClass="ui-button-secondary"/>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{externalGroupCreateBean.groupAdmin}" layout="block">
            <div class="page-head">
                <div>
                    <h1>#{labels['egc.pageTitle']}</h1>
                    <p class="page-sub">#{labels['egc.pageSub']}</p>
                </div>
            </div>

            <h:form id="groupCreateForm">
                <p:panel header="#{labels['egc.details']}">
                    <p:messages closable="true"/>
                    <div class="form-grid">
                        <div class="field">
                            <p:outputLabel for="roleCode" value="#{labels['egc.roleCode']}"/>
                            <p:inputText id="roleCode" value="#{externalGroupCreateBean.role.roleCode}"
                                         required="true" maxlength="200"
                                         requiredMessage="#{labels['egc.roleCodeRequired']}"/>
                            <p:message for="roleCode"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="roleName" value="#{labels['egc.roleNameEn']}"/>
                            <p:inputText id="roleName" value="#{externalGroupCreateBean.role.roleName}"
                                         required="true" maxlength="30"
                                         requiredMessage="#{labels['egc.roleNameRequired']}"/>
                            <p:message for="roleName"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="roleNameS" value="#{labels['egc.roleNameSec']}"/>
                            <p:inputText id="roleNameS" value="#{externalGroupCreateBean.role.roleNameS}"
                                         maxlength="30"/>
                        </div>

                        <div class="field full">
                            <p:outputLabel for="homeMsg" value="#{labels['egc.homeMsgEn']}"/>
                            <p:inputTextarea id="homeMsg" value="#{externalGroupCreateBean.role.homeMsg}" rows="3"/>
                        </div>

                        <div class="field full">
                            <p:outputLabel for="homeMsgS" value="#{labels['egc.homeMsgSec']}"/>
                            <p:inputTextarea id="homeMsgS" value="#{externalGroupCreateBean.role.homeMsgS}" rows="3"/>
                        </div>
                    </div>

                    <div class="action-bar" style="margin-top:18px;">
                        <p:commandButton value="#{labels['egc.create']}" icon="pi pi-plus"
                                         action="#{externalGroupCreateBean.save}"
                                         styleClass="ui-button-success"/>
                        <p:commandButton type="reset" value="#{labels['common.reset']}" icon="pi pi-replay"
                                         styleClass="ui-button-secondary ui-button-outlined"/>
                        <p:button outcome="/group-memberships" value="#{labels['menu.groupMemberships']}" icon="pi pi-users"
                                  styleClass="ui-button-secondary ui-button-outlined"/>
                    </div>
                </p:panel>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
</html>
