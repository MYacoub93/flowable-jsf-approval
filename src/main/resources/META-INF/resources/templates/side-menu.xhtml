<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                      xmlns:h="jakarta.faces.html"
                      xmlns:ui="jakarta.faces.facelets">
    <!-- Side menu: brand, role-aware navigation, sign-out lives in the header.
         Included from templates/portal.xhtml. Pages pass ui:param activeMenu to
         highlight the current entry. Hidden when not logged in. -->
    <ui:fragment rendered="#{loginBean.loggedIn}">
        <aside class="app-sidebar" id="app-sidebar">
            <h:link outcome="/dashboard" styleClass="brand">
                <span class="brand-badge"><i class="pi pi-verified"/></span>
                <span class="brand-text">Workflow Station</span>
            </h:link>
            <nav class="nav">
                <div class="nav-label">Workflow</div>
                <h:link outcome="/dashboard" styleClass="nav-item #{activeMenu == 'dashboard' ? 'active' : ''}">
                    <i class="pi pi-home"/><span>Dashboard</span>
                </h:link>
                <h:link outcome="/processes" styleClass="nav-item #{activeMenu == 'processes' ? 'active' : ''}">
                    <i class="pi pi-list"/><span>Processes</span>
                </h:link>
                <h:link outcome="/start-process" styleClass="nav-item #{activeMenu == 'start-process' ? 'active' : ''}">
                    <i class="pi pi-plus-circle"/><span>Start Request</span>
                </h:link>

                <div class="nav-label">Requests</div>
                <h:link outcome="/start-clearance" styleClass="nav-item #{activeMenu == 'start-clearance' ? 'active' : ''}">
                    <i class="pi pi-file"/><span>Clearance Letter</span>
                </h:link>

                <h:link outcome="/start-student-proof" styleClass="nav-item #{activeMenu == 'start-student-proof' ? 'active' : ''}">
                    <i class="pi pi-verified"/><span>Student Proof Certificate</span>
                </h:link>

                <ui:fragment rendered="#{externalGroupService.isGroupAdmin(loginBean.currentUser.id)}">
                    <div class="nav-label">Administration</div>
                    <h:link outcome="/external-group-create" styleClass="nav-item #{activeMenu == 'external-groups' ? 'active' : ''}">
                        <i class="pi pi-sitemap"/><span>External Groups</span>
                    </h:link>
                    <h:link outcome="/group-memberships" styleClass="nav-item #{activeMenu == 'group-memberships' ? 'active' : ''}">
                        <i class="pi pi-users"/><span>Group Memberships</span>
                    </h:link>
                    <h:link outcome="/users_managment" styleClass="nav-item #{activeMenu == 'users-managment' ? 'active' : ''}">
                        <i class="pi pi-user-edit"/><span>Users Management</span>
                    </h:link>

                    <!-- Dev-only destructive tool: additionally guarded by
                         app.dev-mode.enabled (server-side check in
                         ClearDataService on every action). -->
                    <h:link outcome="/clear-data" styleClass="nav-item #{activeMenu == 'clear-data' ? 'active' : ''}"
                            rendered="#{clearDataService.isDevMode()}">
                        <i class="pi pi-trash"/><span>Clear Data</span>
                    </h:link>
                </ui:fragment>
            </nav>

            <div class="nav-footer">
                Flowable BPM &#183; Jakarta Faces
            </div>
        </aside>
    </ui:fragment>
</ui:composition>
